name: Docker Build and Push
description: >
  Compute versioned image tag, build with BuildKit via docker/build-push-action,
  and push to OCI registry.

inputs:
  image_name:
    description: 'Image name without registry/path (e.g. gateway, nix)'
    required: true
  image_sub_path:
    description: 'Path within registry (e.g. ci/build, apps/front, apps/back)'
    required: true
  version:
    description: 'Raw version from source (e.g. 1.2.3 or 0.1.2)'
    required: true
  platforms:
    required: false
    default: 'linux/amd64'
  registry:
    required: false
    default: 'nix-docker.registry.twcstorage.ru'
  registry_username:
    required: true
  registry_password:
    required: true
  build_args:
    description: 'Newline-separated KEY=VALUE build args'
    required: false
    default: ''
  build_secrets:
    description: 'Newline-separated KEY=VALUE BuildKit secrets'
    required: false
    default: ''
  dockerfile:
    required: false
    default: 'Dockerfile'
  test_release:
    description: 'Force release versioning on non-release branch'
    required: false
    default: 'false'
  enable_snapshot_cache:
    description: 'Enable registry build cache for snapshot builds'
    required: false
    default: 'true'

outputs:
  image_tag:
    description: 'Computed image tag (e.g. 1.2.3001 or 1.2.3000-snapshot)'
    value: ${{ steps.versioning.outputs.image_tag }}
  image_digest:
    description: 'sha256 digest of pushed image manifest'
    value: ${{ steps.build.outputs.digest }}

runs:
  using: composite
  steps:
    - name: Compute image tag
      id: versioning
      shell: bash
      env:
        REGISTRY: ${{ inputs.registry }}
        IMAGE_SUB_PATH: ${{ inputs.image_sub_path }}
        IMAGE_NAME: ${{ inputs.image_name }}
        VERSION: ${{ inputs.version }}
        TEST_RELEASE: ${{ inputs.test_release }}
        REGISTRY_USERNAME: ${{ inputs.registry_username }}
        REGISTRY_PASSWORD: ${{ inputs.registry_password }}
      run: bash "${{ github.action_path }}/compute-tag.sh"

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to Docker registry
      uses: docker/login-action@v4
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.registry_username }}
        password: ${{ inputs.registry_password }}

    - name: Resolve cache settings
      id: cache
      shell: bash
      run: |
        if [[ "${{ inputs.enable_snapshot_cache }}" == "true" ]]; then
          echo "cache_from=${{ steps.versioning.outputs.cache_from }}" >> "$GITHUB_OUTPUT"
          echo "cache_to=${{ steps.versioning.outputs.cache_to }}" >> "$GITHUB_OUTPUT"
        else
          echo "cache_from=" >> "$GITHUB_OUTPUT"
          echo "cache_to=" >> "$GITHUB_OUTPUT"
        fi

    - name: Build and push
      id: build
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ${{ inputs.dockerfile }}
        platforms: ${{ inputs.platforms }}
        push: true
        provenance: false
        tags: ${{ inputs.registry }}/${{ inputs.image_sub_path }}/${{ inputs.image_name }}:${{ steps.versioning.outputs.image_tag }}
        build-args: ${{ inputs.build_args }}
        secrets: ${{ inputs.build_secrets }}
        cache-from: ${{ steps.cache.outputs.cache_from }}
        cache-to: ${{ steps.cache.outputs.cache_to }}
